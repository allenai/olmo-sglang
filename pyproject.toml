[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "olmo-sglang"
version = "0.1.0"
description = "Out-of-tree SGLang model support for Olmo 3 hybrid MoE models"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0 AND MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "LICENSES/*.txt"]

[project.urls]
Repository = "https://github.com/allenai/olmo-sglang"

[project.scripts]
olmo-sglang-smoke = "olmo_sglang.validation.inference:main"
olmo-sglang-parity = "olmo_sglang.validation.parity:main"
olmo-sglang-radix-smoke = "olmo_sglang.validation.radix:main"
olmo-sglang-speculative-smoke = "olmo_sglang.validation.speculative:main"
olmo-sglang-tp-smoke = "olmo_sglang.validation.tensor_parallel:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
olmo_sglang = ["moe_configs/configs/*/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.olmo-sglang.compatibility]
sglang-version = "0.0.0.dev1+gb84bec576"
sglang-source-commit = "b84bec5761a6cdc8b1df86b9b89ead80a7a9bb02"
# Source SHA is authoritative; this development build has no release tag.
