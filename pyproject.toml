[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "olmo-sglang"
version = "0.1.0"
description = "Out-of-tree SGLang model support for Olmo 3 hybrid MoE models"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"

[project.urls]
Repository = "https://github.com/allenai/olmo-sglang"

[project.scripts]
olmo-sglang-smoke = "olmo_sglang.validation.inference:main"
olmo-sglang-parity = "olmo_sglang.validation.parity:main"
olmo-sglang-radix-smoke = "olmo_sglang.validation.radix:main"
olmo-sglang-speculative-smoke = "olmo_sglang.validation.speculative:main"
olmo-sglang-tp-smoke = "olmo_sglang.validation.tensor_parallel:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.olmo-sglang.compatibility]
sglang-version = "0.5.19.dev49+g3145136"
sglang-source-commit = "3145136dcd1238754e0ea2b2ffd546532119c71c"
# The release tag and MILES audit identify the unchanged base; the source adds
# only bounded HTTP readiness before optional Python GC freezing.
sglang-tag-object = "ff4c6e641d9f9bb174d34ff651c01c114aea8e40"
sglang-miles-audit-commit = "3bbb2812e2ca1defdee76f6ec09dbb2456c21c69"
